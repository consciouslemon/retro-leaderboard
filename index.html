<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Reviews Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .retro-font { font-family: 'Press Start 2P', monospace; }
    
    .floating-shadow {
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7));
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

  <header class="py-8 border-b-4 border-yellow-500 bg-gray-950 text-center">
    <h1 class="retro-font text-xl md:text-3xl text-yellow-500 tracking-wider uppercase drop-shadow-[0_4px_0_rgba(0,0,0,1)]">
      The Leaderboard
    </h1>
    <p class="text-gray-400 mt-3 text-xs md:text-sm tracking-wide">Where every reviewed classic stacks up</p>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10">
    
    <!-- Top Categories Highlight Banner -->
    <div id="top-categories" class="mb-12 grid grid-cols-1 md:grid-cols-3 gap-6 border-b-4 border-gray-800 pb-10 hidden">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Main Leaderboard Grid -->
    <div id="leaderboard-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-6 gap-y-12">
    </div>
  </main>

  <script>
    async function loadLeaderboard() {
      try {
        const response = await fetch('games.json');
        const games = await response.json();
        
        // Render the top games per category BEFORE sorting the main grid by overall score
        renderTopCategories(games);

        // Auto-sort dynamically by overall score descending (Highest to Lowest)
        games.sort((a, b) => parseFloat(b.score) - parseFloat(a.score));

        const grid = document.getElementById('leaderboard-grid');
        
        // Added 'index' parameter here to automatically calculate the rank
        grid.innerHTML = games.map((game, index) => {
          const currentRank = index + 1;
          const platforms = Array.isArray(game.platform) ? game.platform : [game.platform];
          
          const platformBadges = platforms.map(plat => `
            <span class="inline-block bg-blue-900 text-blue-300 text-[9px] font-semibold px-1.5 py-0.5 rounded uppercase tracking-wider mr-1 mb-1">
              ${plat}
            </span>
          `).join('');

          return `
            <div class="relative flex flex-col group h-full opacity-0 translate-y-10 transition-all duration-700 ease-out scroll-reveal">
              
              <div class="relative z-10 w-full mb-3 floating-shadow transform group-hover:scale-105 transition-transform duration-300 ease-out">
                
                <img src="${game.boxArt}" 
                     alt="${game.title} Box Art" 
                     class="object-contain w-full h-auto"
                     onerror="this.src='https://placehold.co/300x400/1f2937/9ca3af?text=No+Image'">
                
                <!-- Automatically displays the calculated rank -->
                <div class="absolute -top-3 -left-3 bg-yellow-500 text-gray-950 retro-font text-[10px] px-2 py-1 font-bold z-20 border-2 border-black shadow-md drop-shadow-lg">
                  #${currentRank}
                </div>

              </div>

              <div class="p-3 flex-grow flex flex-col justify-between bg-gray-950 border-4 border-gray-800 rounded-none shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                <div>
                  <h2 class="font-bold text-sm text-white line-clamp-2 leading-snug">${game.title}</h2>
                  <div class="flex flex-wrap mt-1.5">
                    ${platformBadges}
                  </div>
                </div>
                
                <div class="mt-3 pt-2 border-t border-gray-800 flex items-center justify-between">
                  <span class="retro-font text-yellow-400 text-xs">${game.score}</span>
                  ${game.videoUrl ? `
                    <a href="${game.videoUrl}" target="_blank" class="text-xs text-red-400 hover:text-red-300 font-medium underline flex items-center gap-1">
                      Review →
                    </a>
                  ` : ''}
                </div>
              </div>

            </div>
          `;
        }).join('');

        initScrollReveal();

      } catch (error) {
        console.error("Error fetching or parsing games.json:", error);
      }
    }

    function renderTopCategories(games) {
      const categories = [
        { key: 'accessibilityScore', label: 'Top Accessibility' },
        { key: 'gameplayScore', label: 'Top Gameplay' },
        { key: 'evergreenScore', label: 'Most Evergreen' }
      ];

      const topContainer = document.getElementById('top-categories');
      let htmlContent = '';

      categories.forEach(cat => {
        const validGames = games.filter(g => typeof g[cat.key] === 'number');
        if (validGames.length === 0) return;

        const topGame = validGames.sort((a, b) => b[cat.key] - a[cat.key])[0];

        htmlContent += `
          <div class="bg-gray-950 border-4 border-gray-800 p-3 flex items-center gap-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transform hover:-translate-y-1 transition-transform duration-200">
            <img src="${topGame.boxArt}" alt="${topGame.title}" class="w-12 sm:w-16 h-auto object-contain" onerror="this.src='https://placehold.co/150x200/1f2937/9ca3af?text=No+Image'">
            <div class="flex-grow">
              <h3 class="text-yellow-500 retro-font text-[8px] sm:text-[10px] mb-1.5 leading-relaxed uppercase">${cat.label}</h3>
              <p class="text-white font-bold text-xs sm:text-sm line-clamp-1">${topGame.title}</p>
              <p class="text-gray-400 text-xs mt-0.5">${topGame[cat.key]} / 10</p>
            </div>
          </div>
        `;
      });

      if (htmlContent) {
        topContainer.innerHTML = htmlContent;
        topContainer.classList.remove('hidden'); 
      }
    }

    function initScrollReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.remove('opacity-0', 'translate-y-10');
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.1
      });

      document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
    }

    document.addEventListener('DOMContentLoaded', loadLeaderboard);
  </script>
</body>
</html>
